<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaraScan v4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* A camera screen: dark in both light and dark mode, like the system camera */
:root{
  --bg:#000000; --ink:#FFFFFF; --muted:#C9CED6; --accent:#FFD60A; --pill:#FFFFFF; --pill-ink:#000000;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000000; --ink:#FFFFFF; --muted:#C9CED6; --accent:#FFD60A; --pill:#FFFFFF; --pill-ink:#000000; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#000000; --ink:#FFFFFF; --muted:#C9CED6; --accent:#FFD60A; --pill:#FFFFFF; --pill-ink:#000000; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); overflow:hidden; display:flex; flex-direction:column;
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.4; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 16px;min-height:48px}
.top button{min-height:44px;font-size:1.05rem}
.top .name{color:var(--muted);font-size:.8rem}
.top .ghost{visibility:hidden}

.view{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.view video{max-width:100%;max-height:100%;display:block}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){ .flash{transition:opacity .25s} }
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  background:rgba(0,0,0,.55);padding:8px 16px;border-radius:10px;font-size:1rem}
.hint:empty{display:none}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:var(--bg)}
.start[hidden]{display:none}
.start h1{font-size:1.6rem;margin:0}
.start p{margin:0;color:var(--muted);max-width:24rem}
.big{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border-radius:999px;background:var(--pill);color:var(--pill-ink);font-weight:700}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.bottom{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 18px 16px}
.last{justify-self:start;width:52px;height:68px;border-radius:5px;background:#1b1b1b center/cover no-repeat;border:1px solid #444;padding:0}
.last[disabled]{opacity:0}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:5px solid #000;box-shadow:0 0 0 3px #fff}
.shutter:active{transform:scale(.94)}
.shutter[disabled]{opacity:.35}
.save{justify-self:end;min-height:44px;padding:0 18px;border-radius:999px;background:var(--pill);color:var(--pill-ink);font-weight:700;white-space:nowrap}
.save[disabled]{opacity:.45}
.save.none{visibility:hidden}
</style>
</head>
<body>
<div class="top">
  <button id="cancel" class="ghost" type="button">Cancel</button>
  <span class="name">TaraScan v4.0</span>
  <button class="ghost" type="button" aria-hidden="true" tabindex="-1">Cancel</button>
</div>

<div class="view" id="view">
  <video id="video" playsinline muted autoplay></video>
  <div class="flash" id="flash"></div>
  <div class="hint" id="hint" role="status" aria-live="polite"></div>
  <div class="start" id="start">
    <h1>TaraScan</h1>
    <p id="startText">Scan paper pages into one PDF. Each photo is cleaned up so the paper comes out white and easy to read.</p>
    <button class="big" id="startBtn" type="button">Open camera</button>
    <label class="big" id="fileLbl" for="fileIn" hidden>Take photos with the iPhone camera</label>
    <input type="file" id="fileIn" accept="image/*" multiple>
  </div>
</div>

<div class="bottom">
  <button class="last" id="last" type="button" aria-label="Remove the last page" disabled></button>
  <button class="shutter" id="shutter" type="button" aria-label="Take photo" disabled></button>
  <button class="save none" id="save" type="button" disabled>Save</button>
</div>

<script>
(() => {
"use strict";
const VERSION = "v4.0 · 2026-11-18_11-07";
const MAX_OUT = 1500;   // page long edge in the PDF (about 0.4 MB per page)
let pages = [];          // {id, order, out, ow, oh, url, busy}
const $ = id => document.getElementById(id);

/* ---------- storage (per-device, optional) ---------- */
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try{
      const r = indexedDB.open("sayfa-tarayici",1);
      r.onupgradeneeded = () => r.result.createObjectStore("pages",{keyPath:"id"});
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
  return dbp;
}
async function dbPut(p){
  try{ const d = await idb(); if(!d) return;
    const {url, ...rec} = p; d.transaction("pages","readwrite").objectStore("pages").put(rec);
  }catch(e){}
}
async function dbDel(id){
  try{ const d = await idb(); if(!d) return; d.transaction("pages","readwrite").objectStore("pages").delete(id); }catch(e){}
}
async function dbAll(){
  try{ const d = await idb(); if(!d) return [];
    return await new Promise(res=>{ const q=d.transaction("pages").objectStore("pages").getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]); });
  }catch(e){ return []; }
}

/* ---------- image helpers ---------- */
function loadImg(blob){
  return new Promise((res,rej)=>{
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = ()=>{ res(im); setTimeout(()=>URL.revokeObjectURL(u),0); };
    im.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error("Image could not be opened")); };
    im.src = u;
  });
}
function canvas(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
function toBlob(c,q=.88){ return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q)); }

// the whole photo, scaled down to the page size: what the camera shows is what goes into the PDF
async function fit(blob){
  const im = await loadImg(blob);
  const s = Math.min(1, MAX_OUT/Math.max(im.naturalWidth, im.naturalHeight));
  const c = canvas(Math.max(1,Math.round(im.naturalWidth*s)), Math.max(1,Math.round(im.naturalHeight*s)));
  const x = c.getContext("2d",{willReadFrequently:true}); x.imageSmoothingQuality="high"; x.drawImage(im,0,0,c.width,c.height);
  return c;
}

/* ---------- enhancement ---------- */
function enhance(c){
  const w=c.width, h=c.height, n=w*h, x=c.getContext("2d",{willReadFrequently:true});
  const img=x.getImageData(0,0,w,h), d=img.data;
  // 1) white balance: the paper colour is the typical colour of the brightest third of the photo.
  //    One gain per channel for the whole page, so warm room light doesn't leave the paper yellow.
  const hist=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)], lh=new Uint32Array(256); let cnt=0;
  for(let p=0;p<n*4;p+=16){ lh[(d[p]*.299+d[p+1]*.587+d[p+2]*.114)|0]++; cnt++; }
  if(cnt>n/4*.05){
    let acc=0, lcut=0; for(let v=255;v>=0;v--){ acc+=lh[v]; if(acc>=cnt*.33){ lcut=v; break; } }   // brightest third = paper
    let m=0; for(let p=0;p<n*4;p+=16){ const r=d[p], g=d[p+1], b=d[p+2];
      if(r*.299+g*.587+b*.114>=lcut){ hist[0][r]++; hist[1][g]++; hist[2][b]++; m++; } }
    const med=hist.map(hh=>{ let a2=0; for(let v=0;v<256;v++){ a2+=hh[v]; if(a2>=m/2) return Math.max(v,1); } return 255; });
    const top=Math.max(med[0],med[1],med[2]), gain=med.map(v=>Math.min(1.6,top/v));
    if(gain[0]>1.01||gain[1]>1.01||gain[2]>1.01)
      for(let p=0;p<n*4;p+=4){ for(let q=0;q<3;q++){ const v=d[p+q]*gain[q]; d[p+q]=v>255?255:v; } }
  }
  // 2) shadows: brightness of the paper on a small grid (max filter, then blur), divided out
  const k=16, sw=Math.ceil(w/k), sh=Math.ceil(h/k), sm=new Float32Array(sw*sh);
  for(let j=0;j<sh;j++) for(let i=0;i<sw;i++){
    let mx=0; const yb=Math.min(h,(j+1)*k), xb=Math.min(w,(i+1)*k);
    for(let y=j*k;y<yb;y+=2) for(let xx=i*k;xx<xb;xx+=2){ const p=(y*w+xx)*4; const L=d[p]*.299+d[p+1]*.587+d[p+2]*.114; if(L>mx) mx=L; }
    sm[j*sw+i]=mx; }
  const filt=(arr,useMax)=>{ const r=new Float32Array(sw*sh); for(let j=0;j<sh;j++) for(let i=0;i<sw;i++){ let acc=0, c2=0, mx=0;
      for(let dj=-2;dj<=2;dj++) for(let di=-2;di<=2;di++){ const jj=j+dj, ii=i+di; if(jj<0||ii<0||jj>=sh||ii>=sw) continue; const v=arr[jj*sw+ii]; acc+=v; c2++; if(v>mx) mx=v; }
      r[j*sw+i]= useMax ? mx : acc/c2; } return r; };
  let bg=filt(sm,true); bg=filt(bg,false); bg=filt(bg,false);
  // the desk around the page is not paper: don't lift anything that is much darker than the paper itself
  const srt=Float32Array.from(bg).sort(), floor=Math.max(60,.6*srt[Math.floor(srt.length*.9)]);
  for(let i=0;i<bg.length;i++) if(bg[i]<floor) bg[i]=floor;
  for(let y=0;y<h;y++){ const fy=Math.min(sh-1.001,Math.max(0,(y+.5)/k-.5)), jy=fy|0, ty=fy-jy;
    for(let xx=0;xx<w;xx++){ const fx=Math.min(sw-1.001,Math.max(0,(xx+.5)/k-.5)), ix=fx|0, tx=fx-ix;
      const i00=jy*sw+ix, i10=i00+sw, top=bg[i00]+(bg[i00+1]-bg[i00])*tx, bot=bg[i10]+(bg[i10+1]-bg[i10])*tx;
      const p=(y*w+xx)*4, sc=255/((top+(bot-top)*ty)*.93);   // .93 pushes paper grain to clean white
      for(let q=0;q<3;q++){ let v=d[p+q]*sc; v=255-(255-v)*1.25; d[p+q]= v<0?0:v>255?255:v; }
    } }
  x.putImageData(img,0,0);
  return c;
}
async function render(p, blob){
  const c = enhance(await fit(blob));
  p.out = await toBlob(c,.86); p.ow=c.width; p.oh=c.height;
  if(p.url) URL.revokeObjectURL(p.url); p.url = URL.createObjectURL(p.out);
}

/* ---------- pages ---------- */
let hintT;
function hint(text, hold){ $("hint").textContent=text; clearTimeout(hintT); if(hold) hintT=setTimeout(()=>{ if($("hint").textContent===text) $("hint").textContent=""; },hold); }
function refresh(){
  pages.sort((a,b)=>a.order-b.order);
  const n=pages.length, busy=pages.some(p=>p.busy), lastDone=[...pages].reverse().find(p=>p.url);
  $("last").disabled=!n; $("last").style.backgroundImage= lastDone ? `url(${lastDone.url})` : "";
  const sv=$("save"); sv.disabled=!n||busy; sv.classList.toggle("none",!n); if(!pendingShare) sv.textContent=`Save (${n})`;
  $("cancel").classList.toggle("ghost",!n);
}
let queue=Promise.resolve();
function addPhoto(blob){
  const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), order:(pages.length?Math.max(...pages.map(q=>q.order)):0)+1, busy:true};
  pages.push(p); pendingShare=null; refresh();
  queue=queue.then(async()=>{
    try{
      await render(p, blob); p.busy=false; await dbPut(p);
    }catch(e){ pages=pages.filter(q=>q!==p); hint("That photo couldn’t be read. Take it again.",4000); }
    refresh();
  });
}
async function clearPages(){
  for(const p of pages){ if(p.url) URL.revokeObjectURL(p.url); await dbDel(p.id); }
  pages=[]; pendingShare=null; refresh();
}
$("cancel").onclick=async()=>{ if(!pages.length) return;
  if(confirm(`Discard ${pages.length} scanned ${pages.length===1?"page":"pages"}?`)){ await clearPages(); hint("Scan discarded.",2500); } };
$("last").onclick=async()=>{ const p=pages[pages.length-1]; if(!p||p.busy) return;
  if(confirm("Remove the last page?")){ pages.pop(); if(p.url) URL.revokeObjectURL(p.url); await dbDel(p.id); pendingShare=null; refresh(); } };

/* ---------- camera ---------- */
const cam={stream:null};
async function openCamera(){
  if(cam.stream) return;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ camFail(); return; }
  try{
    cam.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:2560},height:{ideal:1920}}});
    const v=$("video"); v.srcObject=cam.stream; await v.play();
    $("start").hidden=true; $("shutter").disabled=false;
    hint(pages.length?"Ready for next scan.":"Fill the frame with the page.",3500);
  }catch(e){ camFail(); }
}
function camFail(){
  $("start").hidden=false; $("startBtn").textContent="Try the camera again"; $("fileLbl").hidden=false;
  $("startText").textContent="The camera couldn’t be opened. Allow camera access for this site in Safari, or take the photos with the iPhone camera instead.";
}
function stopCamera(){ if(cam.stream){ cam.stream.getTracks().forEach(t=>t.stop()); cam.stream=null; } $("video").srcObject=null; $("shutter").disabled=true; }
$("startBtn").onclick=openCamera;
$("fileIn").onchange=e=>{ const fs=[...e.target.files]; fs.forEach(addPhoto); e.target.value=""; if(fs.length) hint("Photos added. Tap Save when you’re done.",4000); };
$("shutter").onclick=async()=>{
  const v=$("video"); if(!v.videoWidth) return;
  const f=$("flash"); f.style.opacity=".8"; setTimeout(()=>f.style.opacity="0",120);
  const c=canvas(v.videoWidth,v.videoHeight); c.getContext("2d").drawImage(v,0,0);
  const blob=await toBlob(c,.92); if(!blob) return;
  addPhoto(blob); hint("Ready for next scan.",2500);
};
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ if(cam.stream){ stopCamera(); cam.resume=true; } } else if(cam.resume){ cam.resume=false; openCamera(); } });

/* ---------- save as PDF ---------- */
let pendingShare=null;
function stamp(){ const d=new Date(), z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}`; }
function blobToDataURL(b){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }
function copyName(name){ try{ navigator.clipboard && navigator.clipboard.writeText(name.replace(/\.pdf$/i,"")).catch(()=>{}); }catch(e){} }
async function finished(name,size){ await clearPages(); hint(`${name} saved (${(size/1048576).toFixed(1)} MB). Ready for a new scan.`,6000); }
async function shareFile(file,name){
  try{ await navigator.share({files:[file],title:name}); await finished(name,file.size); }
  catch(err){
    if(err&&err.name==="AbortError"){ hint("Not saved. Your pages are still here.",3500); return; }
    if(err&&err.name==="NotAllowedError"){ pendingShare={file,name}; $("save").textContent="Share PDF"; $("save").disabled=false; hint("PDF is ready. Tap “Share PDF”.",6000); return; }
    hint("The PDF couldn’t be saved.",4000);
  }
}
$("save").onclick=async()=>{
  if(pendingShare){ copyName(pendingShare.name); shareFile(pendingShare.file,pendingShare.name); return; }
  if(!pages.length) return;
  if(!window.jspdf){ hint("The PDF tool didn’t load. Check your connection and reload the page.",5000); return; }
  const name=`Scan_${stamp()}.pdf`; copyName(name);
  const sv=$("save"); sv.disabled=true; hint("Making the PDF…");
  try{
    let doc=null;
    for(const p of pages){
      const land=p.ow>p.oh, pw=land?297:210, ph=land?210:297, url=await blobToDataURL(p.out);
      if(!doc) doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:land?"l":"p",compress:true}); else doc.addPage("a4",land?"l":"p");
      const s=Math.min(pw/p.ow,ph/p.oh), w=p.ow*s, h=p.oh*s;
      doc.addImage(url,"JPEG",(pw-w)/2,(ph-h)/2,w,h,undefined,"FAST");
      await new Promise(r=>setTimeout(r,0));
    }
    doc.setProperties({title:name.replace(/\.pdf$/i,""),creator:"TaraScan "+VERSION});
    const out=doc.output("blob");
    const file=new File([out],name,{type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ sv.disabled=false; await shareFile(file,name); refresh(); return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(out); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    await finished(name,out.size);
  }catch(e){ hint("The PDF couldn’t be created.",4000); }
  refresh();
};

/* ---------- start ---------- */
(async()=>{
  const recs=await dbAll();
  for(const r of recs){ if(r.out){ r.url=URL.createObjectURL(r.out); r.busy=false; pages.push(r); } }
  refresh();
  if(pages.length) hint(`${pages.length} ${pages.length===1?"page":"pages"} from your last scan are still here.`,4000);
  // try to open the camera straight away; if the browser wants a tap first, the start screen stays
  try{ const st=navigator.permissions && await navigator.permissions.query({name:"camera"}); if(st && st.state==="granted") openCamera(); }catch(e){}
})();
})();
</script>
</body>
</html>
